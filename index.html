<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Launch and trade tokens on Pons V2 — ETH bonding curves on Robinhood Chain that graduate to Uniswap v4." />
    <meta name="theme-color" content="#0b0f0c" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/logo.png" as="image" />
    <title>LOOSE AGENT</title>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 1000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: #0b0f0c;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #splash.hide { opacity: 0; visibility: hidden; }
      #splash .splash-logo {
        width: 120px; height: 120px;
        animation: splash-float 1.6s ease-in-out infinite;
        filter: drop-shadow(0 0 24px rgba(195, 245, 60, 0.45));
      }
      #splash .splash-name {
        font: 800 1.4rem/1 Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.3em; color: #e8f0ea; margin-right: -0.3em;
      }
      #splash .splash-bar {
        width: 200px; height: 4px; border-radius: 999px; overflow: hidden; background: #1a231d;
      }
      #splash .splash-bar::after {
        content: ''; display: block; height: 100%; width: 40%; border-radius: 999px;
        background: linear-gradient(90deg, #7bd83a, #c3f53c);
        animation: splash-run 1.1s ease-in-out infinite;
      }
      @keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes splash-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.04); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-logo, #splash .splash-bar::after { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading">
      <img class="splash-logo" src="/logo.png" alt="" />
      <div class="splash-name">LOOSE AGENT</div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
